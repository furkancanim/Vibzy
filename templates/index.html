<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vibzy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Sadeleştirilmiş Vibe Tasarımı */
    .vibe-results {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .mood-small {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 0.85em;
      color: #666;
      margin-bottom: 10px;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="mark"></div>
        <div class="name">vibzy</div>
      </div>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts">
          {% for category, msg in messages %}
            <div class="alert {{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <section class="card">
      <form class="form" action="{{ url_for('web.upload') }}" method="post" enctype="multipart/form-data">
        <label class="picker">
          <input class="file" type="file" name="file" accept="image/*" required>
          <span>Görsel Seç</span>
        </label>
        <button class="btn" type="submit">Yükle</button>
      </form>
    </section>

    {% if uploaded %}
      <section class="card">
        <div class="row">
          <div class="title">Analiz</div>
          <button class="btn" type="button" onclick="runPredict(this)">Tahmin Et</button>
        </div>

        <div class="preview">
          <img src="{{ url_for('web.uploaded_file', filename=uploaded) }}" alt="Önizleme">
        </div>

        <div class="pred" id="pred"></div>
      </section>
    {% endif %}
  </div>

  <script>
    const predictUrl = "{{ url_for('ml.predict') }}";

    async function runPredict(btn) {
      const el = document.getElementById("pred");
      if (!el) return;

      btn.disabled = true;
      btn.textContent = "Analiz...";
      el.innerHTML = "";

      try {
        const res = await fetch(predictUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ threshold: 0.15, temp: 2.0 })
        });

        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        // Büyük başlığı kaldırdık, Mood ismini sadece küçük bir alt bilgi yaptık
        let html = `<span class="mood-small">Atmosfer: ${data.mood.replace('_', ' ')}</span>`;
        html += `<div class="vibe-results">`;
        
        // Sınıf ve yüzdeleri chip olarak yan yana diziyoruz
        html += data.vibe_mix
          .map(x => `
            <span class="chip">
              <em>${x.class}</em>
              <b>%${(x.conf * 100).toFixed(0)}</b>
            </span>
          `)
          .join("");

        html += `</div>`;
        el.innerHTML = html;

      } catch (e) {
        el.innerHTML = `<div class="alert error">${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Tahmin Et";
      }
    }
  </script>
</body>
</html>
