<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vibzy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    
    .vibe-results {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .gemini-box {
      background: #ffffff;
      padding: 18px;
      border-radius: 12px;
      margin-top: 20px;
      border-left: 5px solid #6200ee;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      color: #333;
      text-align: left;
    }
    .gemini-box h4 { margin-top: 0; color: #6200ee; }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="mark"></div>
        <div class="name">vibzy</div>
      </div>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts">
          {% for category, msg in messages %}
            <div class="alert {{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <section class="card">
      <form class="form" action="{{ url_for('web.upload') }}" method="post" enctype="multipart/form-data">
        <label class="picker">
          <input class="file" type="file" name="file" accept="image/*" required>
          <span>Görsel Seç</span>
        </label>
        <button class="btn" type="submit">Yükle</button>
      </form>
    </section>

    {% if uploaded %}
      <section class="card">
        <div class="row">
          <div class="title">Analiz</div>
          <button class="btn" type="button" onclick="runPredict(this)">Tahmin Et</button>
        </div>

        <div class="preview">
          <img src="{{ url_for('web.uploaded_file', filename=uploaded) }}" alt="Önizleme">
        </div>

        <div class="pred" id="pred"></div>
      </section>
    {% endif %}
  </div>

  <script>
    const predictUrl = "{{ url_for('ml.predict') }}";

    async function runPredict(btn) {
      const el = document.getElementById("pred");
      if (!el) return;

      btn.disabled = true;
      btn.textContent = "Analiz Ediliyor";
      el.innerHTML = '<p style="text-align:center; color:#666;">Vibzy müziğini seçiyor!</p>';

      try {
        const res = await fetch(predictUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ threshold: 0.15, temp: 2.0 })
        });

        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        // çıktı
        let html = `
          <div style="text-align:center; margin-bottom:15px; color:#888; font-size:0.9em;">
            Atmosfer: ${data.mood}
          </div>
          
          <div class="vibe-results">
            ${data.vibe_mix.map(x => `
              <span class="chip">
                <em>${x.class}</em>
                <b>%${(x.conf * 100).toFixed(0)}</b>
              </span>
            `).join("")}
          </div>

          <div class="gemini-box">
            <h4>Öneriler</h4>
            <div style="font-size:0.95em; line-height:1.6;">
              ${data.recommendation.replace(/\n/g, "<br>")}
            </div>
          </div>
        `;
        el.innerHTML = html;

      } catch (e) {
        el.innerHTML = `<div class="alert error">${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Tahmin et";
      }
    }
  </script>
</body>
</html>
